<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플라야 형성 메커니즘 - 단면 모식도 시뮬레이션</title>
    <style>
        body {
            margin: 0; overflow: hidden; background-color: #f0f4f8;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
        }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* 상단 단계 설명 UI */
        #stage-info {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9); color: #333; padding: 15px 30px; 
            border-radius: 8px; text-align: center; width: 80%; max-width: 800px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 2px solid #5c4332;
            pointer-events: none; z-index: 10;
        }
        #stage-title { font-size: 1.4rem; font-weight: 900; margin-bottom: 8px; color: #5c4332; }
        #stage-detail { font-size: 1rem; color: #555; line-height: 1.4; word-break: keep-all; }
        
        /* 하단 컨트롤 패널 */
        #ui-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 800px; background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px; border-radius: 8px; box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            text-align: center; z-index: 10; border: 1px solid #ccc;
        }
        h1 { margin: 0 0 10px 0; font-size: 1.2rem; color: #333; }
        .controls { display: flex; align-items: center; gap: 15px; }
        input[type="range"] { flex-grow: 1; cursor: pointer; height: 6px; }
        button {
            padding: 8px 16px; background-color: #5c4332; color: white;
            border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        button:hover { background-color: #3a2a20; }

        /* 3D 캔버스 위에 고정되는 지형 라벨 */
        .geo-label {
            position: absolute; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.6); color: white;
            padding: 4px 12px; border-radius: 12px; font-size: 0.9rem; 
            font-weight: bold; pointer-events: none; border: 1px solid rgba(255,255,255,0.4);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="label-mountain" class="geo-label">산지</div>
    <div id="label-pediment" class="geo-label">페디먼트</div>
    <div id="label-playa1" class="geo-label">플라야</div>
    <div id="label-playa2" class="geo-label">플라야</div>

    <div id="stage-info">
        <div id="stage-title">1단계: 폐쇄 유역과 건조 분지</div>
        <div id="stage-detail">외곽의 산지, 완만한 페디먼트, 그리고 중앙의 극도로 평탄한 분지 바닥으로 이루어져 있습니다.</div>
    </div>
    
    <div id="ui-panel">
        <h1>플라야 모식도 3D 타임랩스</h1>
        <div class="controls">
            <button id="playBtn">재생 / 일시정지</button>
            <input type="range" id="timeSlider" min="0" max="100" step="0.1" value="0">
        </div>
    </div>

    <script>
        // 1. Scene & Camera Setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(0, 80, 160);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.maxPolarAngle = Math.PI / 2.2; 

        // 2. Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffeedd, 0.9);
        dirLight.position.set(30, 60, 40); dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048; dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -50; dirLight.shadow.camera.right = 50;
        dirLight.shadow.camera.top = 50; dirLight.shadow.camera.bottom = -50;
        scene.add(dirLight);

        // 3. 지형 생성 (단면 모식도 블록)
        const blockGeo = new THREE.BoxGeometry(100, 20, 60, 120, 1, 80);
        const pos = blockGeo.attributes.position;
        const normals = blockGeo.attributes.normal;
        const colors = new Float32Array(pos.count * 3);
        blockGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        
        const baseColors = [];
        const isPlayaVertex = []; 

        function getHeight(x, z) {
            let absX = Math.abs(x);
            if (absX > 32) return 5 + (absX-32)*0.6 + Math.random()*1.5;
            if (absX > 12) return (absX-12)*0.25 + Math.random()*0.2;
            let d1 = Math.sqrt(x*x + (z-12)**2); 
            let d2 = Math.sqrt((x-2)**2 + (z+12)**2);
            if (d1 < 6) return -1.0 + Math.pow(d1/6, 2)*1.0;
            if (d2 < 5) return -0.8 + Math.pow(d2/5, 2)*0.8;
            return Math.random()*0.1;
        }

        for (let i = 0; i < pos.count; i++) {
            let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
            let ny = normals.getY(i);
            let col = new THREE.Color();
            let isPlaya = false;

            if (ny > 0.5) { 
                let h = getHeight(x, z);
                pos.setY(i, h);
                let absX = Math.abs(x);
                if (absX > 32) col.setHex(0x8a6b4e);
                else if (absX > 12) col.setHex(0xbda27e); 
                else {
                    col.setHex(0xcebba1); 
                    let d1 = Math.sqrt(x*x + (z-12)**2);
                    let d2 = Math.sqrt((x-2)**2 + (z+12)**2);
                    if (d1 < 6 || d2 < 5) {
                        col.setHex(0xbca382); isPlaya = true;
                    }
                }
            } else {
                if (y < 0) pos.setY(i, -15);
                col.setHex(0xa0a0a0);
            }
            colors[i*3] = col.r; colors[i*3+1] = col.g; colors[i*3+2] = col.b;
            baseColors.push({ r: col.r, g: col.g, b: col.b });
            isPlayaVertex.push(isPlaya);
        }
        
        blockGeo.computeVertexNormals();
        const matBlock = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 });
        const block = new THREE.Mesh(blockGeo, matBlock);
        block.receiveShadow = true; block.castShadow = true;
        scene.add(block);

        // 4. 물 (일시적 호수)
        const waterMat = new THREE.MeshPhysicalMaterial({
            color: 0x88ccff, transmission: 0.6, transparent: true, roughness: 0.1
        });
        const water1 = new THREE.Mesh(new THREE.CylinderGeometry(5.8, 5.8, 0.2, 32), waterMat);
        const water2 = new THREE.Mesh(new THREE.CylinderGeometry(4.8, 4.8, 0.2, 32), waterMat);
        water1.position.set(0, -1.2, 12); water2.position.set(2, -1.0, -12);
        scene.add(water1); scene.add(water2);

        // --------------------------------------------------------
        // 5. 폭우 모션 (Rain System - 선형 빗줄기)
        // --------------------------------------------------------
        const rainCount = 2000;
        const rainGeo = new THREE.BufferGeometry();
        const rPos = new Float32Array(rainCount * 3);
        for(let i=0; i<rainCount*3; i++) rPos[i] = -100; // 초기 숨김
        rainGeo.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
        const rainMat = new THREE.PointsMaterial({ color: 0x88bbff, size: 0.5, transparent: true, opacity: 0.8 });
        const rainParticles = new THREE.Points(rainGeo, rainMat);
        scene.add(rainParticles);

        // --------------------------------------------------------
        // 6. 증발 모션 (Haze/Evaporation System - 아지랑이)
        // --------------------------------------------------------
        function createHazeTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,0.7)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        const hazeCount = 400;
        const hazeGeo = new THREE.BufferGeometry();
        const hPos = new Float32Array(hazeCount * 3);
        const hPhase = new Float32Array(hazeCount); // 일렁임(Sine Wave)을 위한 위상차
        for(let i=0; i<hazeCount; i++) {
            hPos[i*3] = 0; hPos[i*3+1] = -100; hPos[i*3+2] = 0;
            hPhase[i] = Math.random() * Math.PI * 2;
        }
        hazeGeo.setAttribute('position', new THREE.BufferAttribute(hPos, 3));
        const hazeMat = new THREE.PointsMaterial({ 
            color: 0xffffff, size: 2.5, transparent: true, opacity: 0.6,
            map: createHazeTexture(), depthWrite: false, blending: THREE.AdditiveBlending 
        });
        const hazeParticles = new THREE.Points(hazeGeo, hazeMat);
        scene.add(hazeParticles);

        // 라벨 위치
        const targetPts = {
            mountain: new THREE.Vector3(-40, 10, 0),
            pediment: new THREE.Vector3(22, 3, 0),
            playa1: new THREE.Vector3(0, 0, 12),
            playa2: new THREE.Vector3(2, 0, -12)
        };

        // 7. 시뮬레이션 로직
        const slider = document.getElementById('timeSlider');
        const playBtn = document.getElementById('playBtn');
        const titleEl = document.getElementById('stage-title');
        const detailEl = document.getElementById('stage-detail');
        let isPlaying = false;
        let timeClock = 0;

        function updateLabels() {
            const vec = new THREE.Vector3();
            for (let key in targetPts) {
                vec.copy(targetPts[key]); vec.project(camera);
                const x = (vec.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(vec.y * 0.5) + 0.5) * window.innerHeight;
                const el = document.getElementById(`label-${key}`);
                if(el) { el.style.left = `${x}px`; el.style.top = `${y-20}px`; }
            }
        }

        function updateSimulation() {
            let p = parseFloat(slider.value);
            timeClock += 0.05;

            // UI 텍스트 업데이트
            if (p < 20) {
                titleEl.innerText = "1단계: 폐쇄 유역과 건조 분지";
                detailEl.innerText = "외곽의 산지, 완만한 페디먼트, 그리고 중앙의 평탄한 분지 바닥으로 이루어져 있습니다.";
            } else if (p < 40) {
                titleEl.innerText = "2단계: 폭우와 포상홍수 유입";
                detailEl.innerText = "갑작스러운 폭우가 내리며 물과 염분이 사면을 타고 분지 중앙으로 쏟아져 내립니다.";
            } else if (p < 60) {
                titleEl.innerText = "3단계: 일시적 호수 (Playa Lake)";
                detailEl.innerText = "물이 빠져나가지 못하고 고여 투명한 거울 같은 얕은 호수를 형성합니다.";
            } else if (p < 80) {
                titleEl.innerText = "4단계: 열기와 증발 작용 (아지랑이)";
                detailEl.innerText = "비가 그친 후 강렬한 태양열에 의해 열기가 피어오르며 수분이 빠르게 증발합니다.";
            } else {
                titleEl.innerText = "5단계: 염분 각질층 (Salt Crust) 완성";
                detailEl.innerText = "물이 완전히 마르고 바닥이 수축하면서 하얀 소금 결정(건열)이 평탄하게 덮입니다.";
            }

            // 수위 조절
            let wH = -1.5;
            if (p >= 20 && p <= 40) wH = -1.5 + ((p-20)/20)*1.3;
            else if (p > 40 && p <= 60) wH = -0.2;
            else if (p > 60 && p <= 80) wH = -0.2 - ((p-60)/20)*1.3;
            water1.position.y = wH; water2.position.y = wH + 0.2;
            water1.visible = water2.visible = (wH > -1.4);

            // 소금 바닥 색상 변화
            let saltProg = (p > 80) ? (p - 80) / 20 : 0;
            const posAttr = blockGeo.attributes.position;
            const colAttr = blockGeo.attributes.color;
            for (let i = 0; i < posAttr.count; i++) {
                if (isPlayaVertex[i]) {
                    let base = baseColors[i];
                    colAttr.setXYZ(i, base.r + (1-base.r)*saltProg, base.g + (1-base.g)*saltProg, base.b + (1-base.b)*saltProg);
                }
            }
            colAttr.needsUpdate = true;

            // ---- 폭우 애니메이션 (20~40 구간) ----
            let isRain = (p >= 20 && p < 40);
            const rArray = rainGeo.attributes.position.array;
            for(let i=0; i<rainCount; i++) {
                let idx = i*3;
                if(isRain) {
                    if(rArray[idx+1] < 0 || rArray[idx+1] === -100) {
                        rArray[idx] = (Math.random()-0.5)*90;
                        rArray[idx+1] = 20 + Math.random()*20; // 하늘 위에서 생성
                        rArray[idx+2] = (Math.random()-0.5)*50;
                    } else {
                        rArray[idx] -= 0.15; // 사선으로 내리는 비(바람)
                        rArray[idx+1] -= 1.8; // 매우 빠르게 떨어짐
                    }
                } else {
                    rArray[idx+1] = -100; // 비가 안올때는 숨김
                }
            }
            rainGeo.attributes.position.needsUpdate = true;

            // ---- 아지랑이/증발 애니메이션 (60~80 구간) ----
            let isEvap = (p >= 60 && p < 80);
            const hArray = hazeGeo.attributes.position.array;
            for(let i=0; i<hazeCount; i++) {
                let idx = i*3;
                if(isEvap) {
                    if(hArray[idx+1] < 0 || hArray[idx+1] > 12) {
                        // 두 호수 위에서 랜덤하게 생성
                        let isP1 = Math.random() > 0.5;
                        hArray[idx] = (isP1 ? 0 : 2) + (Math.random()-0.5)*9;
                        hArray[idx+1] = 0; // 바닥 근처에서 시작
                        hArray[idx+2] = (isP1 ? 12 : -12) + (Math.random()-0.5)*9;
                    } else {
                        // 위로 올라가면서 좌우로 일렁이는 모션 (Sine wave)
                        hArray[idx] += Math.sin(timeClock + hPhase[i]) * 0.04;
                        hArray[idx+1] += 0.12; 
                        hArray[idx+2] += Math.cos(timeClock + hPhase[i]) * 0.02;
                    }
                } else {
                    hArray[idx+1] = -100;
                }
            }
            hazeGeo.attributes.position.needsUpdate = true;
        }

        playBtn.addEventListener('click', () => { isPlaying = !isPlaying; });
        slider.addEventListener('input', () => { isPlaying = false; updateSimulation(); });

        function animate() {
            requestAnimationFrame(animate);
            if (isPlaying) {
                let val = parseFloat(slider.value) + 0.15;
                if (val > 100) { val = 0; isPlaying = false; }
                slider.value = val; 
            }
            
            // 일시정지 중이라도 비와 아지랑이는 계속 움직여야 생동감이 있습니다.
            updateSimulation(); 
            controls.update(); updateLabels();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateLabels();
        });

        updateSimulation(); animate();
    </script>
</body>
</html>
